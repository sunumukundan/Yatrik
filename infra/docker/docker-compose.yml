# Local development databases for the fleet platform.
#
# One Postgres instance per service (DB-per-service), each on its own host port and
# with its own role. This mirrors the deployment topology: the services never share a
# schema, and there are no cross-service foreign keys, so a service can be scaled or
# replaced on its own.
#
# Credentials are NOT baked in here. Copy .env.example to .env and fill it in:
#
#   cp .env.example .env
#
# Postgres reads POSTGRES_PASSWORD from the environment of the container, and the
# services read the same values via their own *_DB_PASSWORD variables.
#
# No volume mounts of ./<service>/migrations on purpose: each service runs its own
# Flyway migrations on startup, so the schema always matches the code that is running.
# Mounting the SQL files as well would only create a second source of truth.

name: fleet-platform

services:
  identity-db:
    image: postgres:16
    container_name: fleet-identity-db
    environment:
      POSTGRES_DB: ${IDENTITY_DB_NAME:-identity_db}
      POSTGRES_USER: ${IDENTITY_DB_USER:-identity}
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD in .env}
    ports:
      - "${IDENTITY_DB_PORT:-5432}:5432"
    volumes:
      - identity_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IDENTITY_DB_USER:-identity} -d ${IDENTITY_DB_NAME:-identity_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  fleet-db:
    image: postgres:16
    container_name: fleet-fleet-db
    environment:
      POSTGRES_DB: ${FLEET_DB_NAME:-fleet_db}
      POSTGRES_USER: ${FLEET_DB_USER:-fleet}
      POSTGRES_PASSWORD: ${FLEET_DB_PASSWORD:?set FLEET_DB_PASSWORD in .env}
    ports:
      - "${FLEET_DB_PORT:-5433}:5432"
    volumes:
      - fleet_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FLEET_DB_USER:-fleet} -d ${FLEET_DB_NAME:-fleet_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  trip-db:
    image: postgres:16
    container_name: fleet-trip-db
    environment:
      POSTGRES_DB: ${TRIP_DB_NAME:-trip_db}
      POSTGRES_USER: ${TRIP_DB_USER:-trip}
      POSTGRES_PASSWORD: ${TRIP_DB_PASSWORD:?set TRIP_DB_PASSWORD in .env}
    ports:
      - "${TRIP_DB_PORT:-5434}:5432"
    volumes:
      - trip_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TRIP_DB_USER:-trip} -d ${TRIP_DB_NAME:-trip_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ledger-db:
    image: postgres:16
    container_name: fleet-ledger-db
    environment:
      POSTGRES_DB: ${LEDGER_DB_NAME:-ledger_db}
      POSTGRES_USER: ${LEDGER_DB_USER:-ledger}
      POSTGRES_PASSWORD: ${LEDGER_DB_PASSWORD:?set LEDGER_DB_PASSWORD in .env}
    ports:
      - "${LEDGER_DB_PORT:-5435}:5432"
    volumes:
      - ledger_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LEDGER_DB_USER:-ledger} -d ${LEDGER_DB_NAME:-ledger_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  identity_data:
  fleet_data:
  trip_data:
  ledger_data:
