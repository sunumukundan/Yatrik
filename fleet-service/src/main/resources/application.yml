server:
  port: 8082

spring:
  application:
    name: fleet-service
  datasource:
    # stringtype=unspecified: lets pgjdbc send Java enum values untyped, so Postgres can
    #   implicitly cast them into native ENUM columns (vehicle_status, doc_type, etc.) —
    #   without it, every insert/update touching an enum column fails.
    # options=-c timezone=...: pins the session timezone Postgres receives. Also see the
    #   static block in FleetServiceApplication, which fixes the JVM-level default that
    #   pgjdbc reads *before* this URL option is even applied.
    url: jdbc:postgresql://${FLEET_DB_HOST:localhost}:${FLEET_DB_PORT:5433}/${FLEET_DB_NAME:fleet_db}?options=-c%20timezone=Asia/Kolkata&stringtype=unspecified
    username: ${FLEET_DB_USER:fleet}
    password: ${FLEET_DB_PASSWORD:local_fleet_dev}
  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, never let Hibernate auto-generate it
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # MUST be the exact same value as identity-service's app.jwt.secret — fleet-service
    # only verifies tokens, it never issues them. A mismatch here means every request
    # fails signature verification. See JwtService's class comment for the longer-term plan.
    secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health
