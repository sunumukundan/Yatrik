server:
  port: 8085

spring:
  application:
    name: reporting-service

app:
  jwt:
    # The reporting service verifies tokens like every other data-owning service.
    secret: ${JWT_SECRET}

  fleet:
    base-url: ${FLEET_URL:http://localhost:8082}
  trip:
    base-url: ${TRIP_URL:http://localhost:8083}
  ledger:
    base-url: ${LEDGER_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health
