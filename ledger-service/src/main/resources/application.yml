server:
  port: 8084

spring:
  application:
    name: ledger-service
  datasource:
    url: jdbc:postgresql://${LEDGER_DB_HOST:localhost}:${LEDGER_DB_PORT:5435}/${LEDGER_DB_NAME:ledger_db}?options=-c%20timezone=Asia/Kolkata&stringtype=unspecified
    username: ${LEDGER_DB_USER:ledger}
    password: ${LEDGER_DB_PASSWORD:local_ledger_dev}
  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, never let Hibernate auto-generate it
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # MUST be the exact same value as identity-service's app.jwt.secret — ledger-service
    # only verifies tokens, it never issues them.
    secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health
