server:
  port: 8083

spring:
  application:
    name: trip-service
  datasource:
    # stringtype=unspecified: lets pgjdbc send Java enum values untyped, so Postgres can
    # implicitly cast them into native ENUM columns (trip_status, expense_category, etc.)
    # options=-c timezone=...: pins the session timezone Postgres receives. Also see the
    #   static block in TripServiceApplication, which fixes the JVM-level default that
    #   pgjdbc reads *before* this URL option is even applied.
    url: jdbc:postgresql://${TRIP_DB_HOST:localhost}:${TRIP_DB_PORT:5434}/${TRIP_DB_NAME:trip_db}?options=-c%20timezone=Asia/Kolkata&stringtype=unspecified
    username: ${TRIP_DB_USER:trip}
    password: ${TRIP_DB_PASSWORD:local_trip_dev}
  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, never let Hibernate auto-generate it
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # MUST be the exact same value as identity-service's app.jwt.secret — trip-service
    # only verifies tokens, it never issues them.
    secret: ${JWT_SECRET}

  ledger:
    # Where TripService.complete() posts a trip's freight. Direct HTTP for the MVP.
    base-url: ${LEDGER_BASE_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health
